// Top-level build file where you can add configuration options common to all sub-projects/modules.

project.ext.set("versionMajor", 5)      // Version Major
project.ext.set("versionMinor", 14)     // Version Minor
project.ext.set("versionPatch", 2)      // Version Patch
// ^ keep in sync with cmake

project.ext.set("versionBuild", 2)      // Version Build (increment this for builtin/UI changes!)
// ^ fourth version number to allow releasing Android-only fixes and beta versions

buildscript {
	ext.ndk_version = '27.3.13750724'
	ext.kotlin_version = '1.9.22'
	repositories {
		google()
		mavenCentral()
	}
	dependencies {
		classpath 'com.android.tools.build:gradle:8.12.3'
		classpath 'de.undercouch:gradle-download-task:5.6.0'
		classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
		// NOTE: Do not place your application dependencies here; they belong
		// in the individual module build.gradle files
	}
}

allprojects {
	repositories {
		google()
		mavenCentral()
		// RuStore SDK repository
		maven { url = uri("https://artifactory-external.vkpartner.ru/artifactory/maven") }
	}
}

task clean(type: Delete) {
	delete rootProject.layout.buildDirectory
}
