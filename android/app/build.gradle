apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

// Load properties at top level so they're accessible everywhere
Properties props = new Properties()
def propfile = file('../local.properties')
if (propfile.exists())
	props.load(new FileInputStream(propfile))

// Force BuildConfig regeneration when local.properties changes
// (otherwise Gradle caches old ngrok URLs etc.)
def localPropsInput = propfile.exists() ? propfile : null
def secretsFile = file('src/main/assets/secrets.properties')

tasks.register('validateReleaseAdConfiguration') {
	inputs.file(secretsFile)
	doLast {
		if (!secretsFile.exists()) {
			throw new GradleException(
				'Release build requires android/app/src/main/assets/secrets.properties')
		}

		Properties secrets = new Properties()
		secretsFile.withInputStream { secrets.load(it) }
		def rewardedId = secrets.getProperty(
			'yandex_rewarded_ad_unit_id_production', '').trim()
		if (!(rewardedId ==~ /R-M-\d+-\d+/)) {
			throw new GradleException(
				'Release build requires a production yandex_rewarded_ad_unit_id_production')
		}
	}
}

android {
	ndkVersion "$ndk_version"
	defaultConfig {
		applicationId 'com.VocoCraft.VocoCraft'
		minSdkVersion 24
		compileSdk 36
		targetSdkVersion 36
		versionName "${versionMajor}.${versionMinor}.${versionPatch}"
		versionCode versionMajor * 1000000 + versionMinor * 10000 + versionPatch * 100 + versionBuild
		
		// YooKassa SDK: Deeplink scheme for payment return (SBP, SberPay)
		resValue "string", "ym_app_scheme", "com.vococraft.vococraft"
		
		// YooKassa secrets from local.properties (not committed to git)
		buildConfigField "String", "YOOKASSA_BACKEND_URL_DEBUG", 
			"\"${props.getProperty('yookassa.backend_url_debug', 'https://payments-debug.moodray.ru')}\""
		buildConfigField "String", "YOOKASSA_BACKEND_URL_PROD",
			"\"${props.getProperty('yookassa.backend_url_prod', 'https://payments.moodray.ru')}\""
		buildConfigField "String", "YOOKASSA_SHOP_ID_DEBUG",
			"\"${props.getProperty('yookassa.shop_id_debug', '')}\""
		buildConfigField "String", "YOOKASSA_SHOP_ID_PROD",
			"\"${props.getProperty('yookassa.shop_id_prod', '')}\""
		buildConfigField "String", "YOOKASSA_CLIENT_KEY_DEBUG",
			"\"${props.getProperty('yookassa.client_key_debug', '')}\""
		buildConfigField "String", "YOOKASSA_CLIENT_KEY_PROD",
			"\"${props.getProperty('yookassa.client_key_prod', '')}\""
	}

	buildFeatures {
		buildConfig true
	}

	if (props.getProperty('keystore') != null) {
		signingConfigs {
			release {
				storeFile file(props['keystore'])
				storePassword props['keystore.password']
				keyAlias props['key']
				keyPassword props['key.password']
			}
		}

		buildTypes {
			release {
				minifyEnabled true
				proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
				signingConfig signingConfigs.release
			}
		}
	}

	// for multiple APKs
	splits {
		abi {
			enable true
			reset()
			include 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
		}
	}

	compileOptions {
		sourceCompatibility JavaVersion.VERSION_1_8
		targetCompatibility JavaVersion.VERSION_1_8
	}
	
	kotlinOptions {
		jvmTarget = '1.8'
	}
	
	namespace 'com.VocoCraft.VocoCraft'
}

task prepareAssets() {
	def assetsFolder = "build/assets"
	def projRoot = rootDir.parent

	// See issue #4638
	def unsupportedLanguages = new File("${projRoot}/src/unsupported_language_list.txt").text.readLines()

	doFirst {
		logger.lifecycle('Preparing assets at {}', assetsFolder)
	}
	doLast {
		copy {
			from "${projRoot}/minetest.conf.example", "${projRoot}/README.md" into assetsFolder
		}
		copy {
			from "${projRoot}/doc/lgpl-2.1.txt" into assetsFolder
		}
		copy {
			from "${projRoot}/builtin" into "${assetsFolder}/builtin"
		}
		copy {
			from "${projRoot}/client/shaders" into "${assetsFolder}/client/shaders"
		}
		copy {
			from "${projRoot}/irr/media/Shaders" into "${assetsFolder}/client/shaders/Irrlicht"
		}
		copy {
			from "${projRoot}/fonts" include "*.ttf" into "${assetsFolder}/fonts"
		}
		copy {
			from "${projRoot}/textures/base/pack" into "${assetsFolder}/textures/base/pack"
		}
		// copy games to assets/games
		copy {
			from "${projRoot}/games"
			into "${assetsFolder}/games"
		}
		
		// copy secrets.properties if exists (not in git, contains API keys)
		def packagedSecretsFile = file("src/main/assets/secrets.properties")
		if (packagedSecretsFile.exists()) {
			copy {
				from packagedSecretsFile
				into assetsFolder
			}
		}

		// compile translations
		fileTree("${projRoot}/po").include("**/*.po").grep {
			it.parentFile.name !in unsupportedLanguages
		}.forEach { poFile ->
			def moPath = "${assetsFolder}/locale/${poFile.parentFile.name}/LC_MESSAGES/"
			file(moPath).mkdirs()
			exec {
				commandLine 'msgfmt', '-o', "${moPath}/luanti.mo", poFile
			}
		}

		file("${assetsFolder}/.nomedia").text = ""
	}

	task zipAssets(dependsOn: prepareAssets, type: Zip) {
		archiveFileName = "assets.zip"
		from assetsFolder
		destinationDirectory = file("src/main/assets")
	}
}

preBuild.dependsOn zipAssets
prepareAssets.dependsOn ':native:getDeps'

clean {
	delete new File("src/main/assets", "assets.zip")
}

// Force BuildConfig regeneration when local.properties changes
afterEvaluate {
	tasks.named('preReleaseBuild').configure {
		dependsOn tasks.named('validateReleaseAdConfiguration')
	}
	tasks.matching { it.name.contains('generateBuildConfig') || it.name.contains('GenerateBuildConfig') }.configureEach {
		if (localPropsInput != null) {
			inputs.file(localPropsInput)
		}
	}
}

dependencies {
	implementation project(':native')
	implementation 'androidx.appcompat:appcompat:1.6.1'
	// Material Components (required by YooKassa SDK 8.x)
	implementation 'com.google.android.material:material:1.11.0'
	// Kotlin stdlib
	implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
	// AppMetrica SDK
	implementation 'io.appmetrica.analytics:analytics:7.14.0'
	// Yandex Mobile Ads SDK
	implementation 'com.yandex.android:mobileads:7.18.1'
	// RuStore SDKs - BOM версия (pay commented out, replaced by YooKassa)
	implementation(platform("ru.rustore.sdk:bom:2026.03.01"))
	// implementation("ru.rustore.sdk:pay")
	implementation("ru.rustore.sdk:review")
	implementation("ru.rustore.sdk:appupdate")
	
	// YooKassa SDK for payments
	implementation 'ru.yoomoney.sdk.kassa.payments:yookassa-android-sdk:8.3.0'
	
	// OkHttp for backend API calls
	implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
